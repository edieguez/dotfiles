autofit-larger=100%x100%
border=no
demuxer-max-bytes=512M
demuxer-max-back-bytes=128M
osc=no
osd-bar=no

# High quality rendering
profile=gpu-hq

# Limit video resolution to 720p and 30fps when using youtube-dl
# Higher values may cause slowdown and playback issues on some devices
# ytdl-format=bestvideo[height<=?720][fps<=?30][vcodec!=?vp9]+bestaudio/best

# Resume playback from last position
save-position-on-quit=yes

# Keep the player open after playback ends
keep-open=yes

# Don't quit when launched with no files to play - needed so perpetual-playlist
# gets a chance to run and load the saved playlist on a bare `mpv` invocation
# (mpv's default idle=no quits before user scripts/ ever get loaded)
idle=yes

# Save screenshots to the Desktop
screenshot-directory=~/Desktop

# Perpetual playlist: unix socket for external IPC control
# (see plugins/perpetual-playlist/bin/mpv-add)
input-ipc-server=~/.config/mpv/mpv.sock

# Silence libass's "failed to find any fallback" fontselect warnings - these
# fire on subtitles/OSD text containing color emoji, which libass can never
# render (no color-glyph support), so the warning is just noise
msg-level=osd/libass=error

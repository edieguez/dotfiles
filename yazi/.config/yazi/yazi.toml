[mgr]
linemode = "size"
ratio = [1, 4, 4]   # parent 10% / current 45% / preview 45% (default is 12.5/50/37.5)

[preview]
max_width     = 3840        # default 600 — high enough to not cap below the pane's actual pixel width on HiDPi/4K
max_height    = 3840        # default 900 — generous on both axes since tall panes need height, not just width
image_quality = 90          # default 75 (max useful value)
image_filter  = "lanczos3"  # default "triangle" — highest-quality downscale

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# dot.conf: package rules for ./dot
#
#   [package]
#   os = macos | linux | all   (default: all)
#   only = <pattern>           link only matching files (whitelist)
#   except = <pattern>         link everything except matching files (blacklist)
#
# One pattern per line; add more on indented lines below the key. Patterns
# are zsh globs relative to the package root, may contain spaces, and `*`
# also matches across folders. `only` is applied first, then `except`.
# Packages not listed here link every file on every OS.
# After changing rules, run ./dot restow <package>.
[applications]
os = linux

[kde]
os = linux

[moc]
os = linux

[vlc]
os = linux

[hammerspoon]
# config.lua is machine-local (created from template); CLAUDE.md is generated
except = .hammerspoon/config.lua.template
         .hammerspoon/CLAUDE.md

# Pure Black Vivid
# Ported from the Ghostty terminal theme / Neovim colorscheme of the same
# name: true-black background, saturated/vivid ANSI colors, high contrast.
# Source: ~/.config/ghostty/themes/Pure Black Vivid

code_syntax_highlight = "native"

full_screen_fg = "#d9d9d9"
full_screen_bg = "#000000"

gradient_color = ["#3c78f1", "#13ecec"]
directory_icon_color = ""

file_panel_fg = "#d9d9d9"
file_panel_bg = "#000000"
file_panel_border = "#808080"
file_panel_border_active = "#3c78f1"
file_panel_top_directory_icon = "#13ec13"
file_panel_top_path = "#3c78f1"
file_panel_item_selected_fg = "#ffffff"
file_panel_item_selected_bg = "#444444"

footer_fg = "#d9d9d9"
footer_bg = "#000000"
footer_border = "#808080"
footer_border_active = "#13ec13"

sidebar_fg = "#d9d9d9"
sidebar_bg = "#000000"
sidebar_title = "#13ecec"
sidebar_border = "#808080"
sidebar_border_active = "#ed19ed"
sidebar_item_selected_fg = "#ffffff"
sidebar_item_selected_bg = "#444444"
sidebar_divider = "#808080"

modal_fg = "#d9d9d9"
modal_bg = "#000000"
modal_border_active = "#3c78f1"
modal_cancel_fg = "#000000"
modal_cancel_bg = "#ed1919"
modal_confirm_fg = "#000000"
modal_confirm_bg = "#13ec13"

help_menu_hotkey = "#ecda13"
help_menu_title = "#3c78f1"

cursor = "#ffffff"
correct = "#13ec13"
error = "#ed1919"
hint = "#13ecec"
cancel = "#f53d3d"
